<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Basketball Scoreboard</title>
  </head>
  <body>
    <main>
      <div class="scoreboard-container">
        <div class="scoreboard-card">
          <h1 class="scoreboard-title" id="home-title">Home</h1>
          <div class="scoreboard-score">
            <span class="score" id="home-score">0</span>
          </div>
          <div class="scoreboard-btns">
            <div class="btn" onclick="add1home()">+1</div>
            <div class="btn" onclick="add2home()">+2</div>
            <div class="btn" onclick="add3home()">+3</div>
          </div>
        </div>
        <div class="scoreboard-card">
          <h1 class="scoreboard-title" id="guest-title">Guest</h1>
          <div class="scoreboard-score">
            <span class="score" id="guest-score">0</span>
          </div>
          <div class="scoreboard-btns">
            <div class="btn" onclick="add1guest()">+1</div>
            <div class="btn" onclick="add2guest()">+2</div>
            <div class="btn" onclick="add3guest()">+3</div>
          </div>
        </div>
      </div>
      <button type="reset" class="reset" onclick="reset()">Reset</button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
